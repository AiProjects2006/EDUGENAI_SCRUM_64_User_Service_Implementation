spring.application.name=user-service

server.port=${SERVER_PORT:8081}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/user_service_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:new_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Keycloak Integration
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8090}
keycloak.public-url=${KEYCLOAK_PUBLIC_URL:http://localhost:8090}
keycloak.realm=${KEYCLOAK_REALM:ai-learning-platform}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:edugenai-frontend}
keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:admin}
